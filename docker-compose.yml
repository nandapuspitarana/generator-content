services:
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.17.0
    container_name: asikreview-elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    ports:
      - "9200:9200"
    volumes:
      - es_data:/usr/share/elasticsearch/data
    deploy:
      resources:
        limits:
          memory: 1024M
    restart: unless-stopped
    healthcheck:
      test: [ "CMD-SHELL", "curl -s http://localhost:9200 >/dev/null || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 5

  kibana:
    image: docker.elastic.co/kibana/kibana:8.17.0
    container_name: asikreview-kibana
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
    ports:
      - "5601:5601"
    deploy:
      resources:
        limits:
          memory: 768M
    depends_on:
      elasticsearch:
        condition: service_healthy
    restart: unless-stopped

  fish-speech:
    build:
      context: ./services/fish-speech
      dockerfile: Dockerfile
    container_name: asikreview-fish-speech
    environment:
      - PORT=8765
    ports:
      - "8765:8765"
    volumes:
      - fish_speech_cache:/root/.cache
    deploy:
      resources:
        limits:
          memory: 2560M
    restart: unless-stopped
    healthcheck:
      test: [ "CMD-SHELL", "curl -f http://localhost:8765/v1/health || exit 1" ]
      interval: 15s
      timeout: 5s
      retries: 3

volumes:
  es_data:
    driver: local
  fish_speech_cache:
    driver: local

<body
    class="bg-surface text-on-surface h-full flex font-body-md antialiased selection:bg-primary selection:text-on-primary">
    <!-- SideNavBar (Shared Component) -->
    <nav
        class="h-screen w-64 fixed left-0 top-0 bg-surface-container-low dark:bg-surface-container-lowest flex flex-col h-full border-r border-outline-variant p-6 z-40 hidden md:flex">
        <div class="mb-12">
            <h1 class="font-display-lg text-headline-sm text-on-surface">Editorial CMS</h1>
            <p class="font-body-md text-body-md text-secondary mt-1">Focused Writing</p>
        </div>
        <ul class="flex flex-col gap-2 flex-grow">
            <li>
                <a class="flex items-center gap-3 px-4 py-3 text-secondary dark:text-secondary-fixed-dim hover:bg-surface-container-high dark:hover:bg-surface-container transition-all duration-200 ease-in-out rounded-lg font-label-md text-label-md"

                    <span class="material-symbols-outlined" data-icon="home">home</span>
                    <span>Home</span>
                </a>
            </li>
            <li>
                <a class="flex items-center gap-3 px-4 py-3 bg-primary-container text-on-primary-container rounded-lg font-label-md text-label-md duration-200 ease-in-out"
                    href="#">
                    <span class="material-symbols-outlined" data-icon="menu_book">menu_book</span>
                    <span>Stories</span>
                </a>
            </li>
            <li>
                <a class="flex items-center gap-3 px-4 py-3 text-secondary dark:text-secondary-fixed-dim hover:bg-surface-container-high dark:hover:bg-surface-container transition-all duration-200 ease-in-out rounded-lg font-label-md text-label-md"
                    href="#">
                    <span class="material-symbols-outlined" data-icon="collections_bookmark">collections_bookmark</span>
                    <span>Series</span>
                </a>
            </li>
            <li>
                <a class="flex items-center gap-3 px-4 py-3 text-secondary dark:text-secondary-fixed-dim hover:bg-surface-container-high dark:hover:bg-surface-container transition-all duration-200 ease-in-out rounded-lg font-label-md text-label-md"
                    href="#">
                    <span class="material-symbols-outlined" data-icon="query_stats">query_stats</span>
                    <span>Stats</span>
                </a>
            </li>
            <li>
                <a class="flex items-center gap-3 px-4 py-3 text-secondary dark:text-secondary-fixed-dim hover:bg-surface-container-high dark:hover:bg-surface-container transition-all duration-200 ease-in-out rounded-lg font-label-md text-label-md"
                    href="#">

                    <span>Settings</span>

        <div class="mt-auto pt-6 border-t border-outline-variant">
            <button
                class="w-full bg-primary text-on-primary hover:bg-primary-container hover:text-on-primary-container py-3 px-4 rounded font-label-md text-label-md transition-colors duration-200 flex items-center justify-center gap-2">
                <span class="material-symbols-outlined text-[18px]">add</span>
                Write New Story

    <!-- Main Content Canvas -->
    <main class="flex-1 ml-0 md:ml-64 flex flex-col h-full overflow-hidden bg-surface">
        <!-- TopNavBar (Shared Component) -->
        <header
            class="flex justify-between items-center w-full px-margin-desktop py-4 sticky top-0 z-50 bg-surface dark:bg-surface-dim flat no shadows border-b border-outline-variant md:hidden">
            <div class="font-display-lg text-headline-sm text-primary dark:text-primary-fixed-dim">The Editorial</div>
            <div class="flex items-center gap-4">
                <button
                    class="text-secondary dark:text-secondary-fixed-dim hover:text-on-surface dark:hover:text-on-surface-variant transition-colors cursor-pointer active:scale-95 duration-200">
                    <span class="material-symbols-outlined" data-icon="notifications">notifications</span>
                </button>
                <button
                    class="text-secondary dark:text-secondary-fixed-dim hover:text-on-surface dark:hover:text-on-surface-variant transition-colors cursor-pointer active:scale-95 duration-200">
                    <span class="material-symbols-outlined" data-icon="publish">publish</span>
                </button>
            </div>
        </header>
        <!-- Editor Layout -->
        <div class="flex-1 flex flex-col md:flex-row overflow-hidden relative">
            <!-- Writing Environment -->
            <div
                class="flex-1 overflow-y-auto px-margin-mobile md:px-margin-desktop py-12 flex justify-center relative">
                <!-- Minimal Reading Progress Indicator (Style Guidance) -->
                <div class="fixed top-0 left-0 md:left-64 right-0 h-[2px] bg-surface-variant z-50">
                    <div class="h-full bg-primary w-1/4 transition-all duration-300"></div>
                </div>
                <div class="w-full max-w-article-max flex flex-col gap-8">
                    <!-- Content Status Context -->
                    <div class="flex items-center gap-3 text-secondary font-label-md text-label-md">
                        <span class="material-symbols-outlined text-[16px]">edit_document</span>
                        <span>Draft</span>
                        <span class="w-1 h-1 rounded-full bg-outline-variant"></span>
                        <span>Autosaved just now</span>
                    </div>
                    <!-- Title Input -->
                    <div class="relative group">
                        <input
                            class="w-full bg-transparent border-none p-0 focus:ring-0 font-display-lg text-display-lg-mobile md:text-display-lg text-on-surface placeholder-outline-variant outline-none transition-colors"
                            placeholder="Title..." type="text"
                            value="The Architect of Silence: A Deep Dive into Acoustic Design" />
                    </div>
                    <!-- Meta Information Block -->
                    <div
                        class="flex flex-col md:flex-row md:items-center gap-4 md:gap-8 pb-8 border-b border-surface-variant">
                        <div class="flex-1 group relative">
                            <label class="block font-label-md text-caption text-secondary mb-1">Author</label>
                            <input
                                class="w-full bg-transparent border-b border-transparent focus:border-primary px-0 py-1 font-body-md text-body-md text-on-surface focus:ring-0 transition-colors placeholder-outline-variant"
                                type="text" value="Eleanor Vance" />
                        </div>
                        <div class="flex-1 group relative">
                            <label class="block font-label-md text-caption text-secondary mb-1">Publication Date
                                (Optional)</label>
                            <input
                                class="w-full bg-transparent border-b border-transparent focus:border-primary px-0 py-1 font-body-md text-body-md text-on-surface focus:ring-0 transition-colors text-secondary"
                                type="date" />
                        </div>
                    </div>
                    <!-- Main Body Editor Placeholder -->
                    <div class="relative min-h-[400px]">
                        <textarea
                            class="w-full h-full min-h-[400px] bg-transparent border-none p-0 focus:ring-0 font-body-lg text-body-lg text-on-surface leading-relaxed placeholder-outline-variant resize-none outline-none"
                            placeholder="Start writing here...">The concept of silence is often misunderstood as merely the absence of sound. In truth, true acoustic silence is an engineered state, a deliberate architectural achievement that requires an understanding of physics, material science, and human psychology.

When we consider modern urban environments, the constant hum of infrastructure—traffic, HVAC systems, distant sirens—forms a baseline of noise pollution that our brains constantly filter out. This filtering process demands cognitive energy. The desire for "quiet" spaces is not just aesthetic; it's a physiological need to reduce cognitive load.

Architects tasked with designing soundproof environments, such as anechoic chambers or recording studios, don't just add insulation. They must isolate the space structurally. This often involves building a 'room within a room,' where the inner floor, walls, and ceiling rest on specialized acoustic isolators to decouple them from the main building structure...</textarea>
                    </div>
                    <!-- Additional Notes Area -->
                    <div class="mt-12 p-6 bg-surface-container-lowest rounded-xl border border-surface-variant">
                        <label class="flex items-center gap-2 font-label-md text-label-md text-on-surface mb-3">
                            <span class="material-symbols-outlined" data-icon="speaker_notes">speaker_notes</span>
                            Editorial Notes
                        </label>
                        <textarea
                            class="w-full bg-surface-container-low border-none rounded-lg p-4 font-body-md text-body-md text-secondary focus:ring-1 focus:ring-primary focus:bg-surface-container-lowest transition-all min-h-[100px] resize-y"
                            placeholder="Add internal notes for editors..."></textarea>
                    </div>
                </div>
            </div>
            <!-- Media & Assets Sidebar (Right) -->
            <aside
                class="w-full md:w-80 lg:w-[400px] bg-surface-bright border-l border-surface-variant flex flex-col h-full overflow-y-auto">
                <div class="p-6 flex flex-col gap-8">
                    <!-- Sidebar Header Actions -->
                    <div class="flex justify-between items-center">
                        <h3 class="font-label-md text-label-md text-on-surface uppercase tracking-wider">Asset
                            Management</h3>
                        <button class="text-primary hover:text-primary-container transition-colors">
                            <span class="material-symbols-outlined" data-icon="open_in_full">open_in_full</span>
                        </button>
                    </div>
                    <!-- Featured Image / Banner Generator Preview -->
                    <section class="flex flex-col gap-3">
                        <label class="font-label-md text-caption text-secondary flex justify-between items-center">
                            Featured Banner
                            <span
                                class="text-[10px] bg-surface-variant px-2 py-0.5 rounded text-on-surface-variant">Preview</span>
                        </label>
                        <!-- Image Preview Area -->
                        <div

                            <img class="w-full h-full object-cover absolute inset-0 mix-blend-multiply opacity-80"
                                data-alt="A modern, minimalist architectural space focusing on sound design. Warm, indirect lighting washes over textured wood panels and acoustic foam. The color palette is strictly neutral with deep greys, warm whites, and a single accent of dark emerald green. The aesthetic is clean, professional, and sophisticated, perfectly suited for an editorial banner about acoustic engineering."
                                src="https://lh3.googleusercontent.com/aida-public/AB6AXuDE2AcWpKxRNfIp3c3f_XLQ5Ret7ehjW1aKkS2OwEQG3ShGM2K4_Q3g-LJS1Cp-1qg_rKLGwM5enLzTTPKSg2Vr3f_YheGGYMrRaDpf4XpG0fFiiOEncISVssTkEbWcfE4-XOdfUI_nnPGmyHhhdW-Uz-3sEyCvb9TnXJX5vbuR752WEDOXUPk_7RVe-KkF9YNz9O838b5btkee0inzt-B9NIH8UPF670J65hpUPNbfQu3hxmxQNHEWJPOKWg2kWudRCqi4YAawA_8" />
                            <div

                                    class="bg-surface-container-lowest text-on-surface px-4 py-2 rounded shadow-sm font-label-md text-caption flex items-center gap-2 hover:bg-surface transition-colors">
                                    <span class="material-symbols-outlined text-[16px]"
                                        data-icon="swap_horiz">swap_horiz</span>
                                    Replace Image
                                </button>
                            </div>
                        </div>
                        <div class="flex gap-2 mt-1">
                            <input
                                class="flex-1 bg-surface-container-lowest border border-outline-variant rounded p-2 font-body-md text-caption focus:border-primary focus:ring-0 outline-none transition-colors"
                                placeholder="Paste image URL..." type="text" />
                            <button
                                class="bg-surface-variant text-on-surface-variant px-3 rounded hover:bg-surface-dim transition-colors flex items-center justify-center">
                                <span class="material-symbols-outlined text-[18px]" data-icon="upload">upload</span>
                            </button>
                        </div>
                    </section>
                    <hr class="border-surface-variant" />
                    <!-- Affiliate Links Section -->

                        <div class="flex justify-between items-center">
                            <label class="font-label-md text-caption text-secondary">Associated Links</label>
                            <button
                                class="text-primary text-caption hover:underline font-label-md flex items-center gap-1">
                                <span class="material-symbols-outlined text-[14px]" data-icon="add">add</span> Add
                            </button>
                        </div>
                        <!-- Link List Item -->
                        <div
                            class="bg-surface-container-lowest p-3 rounded-lg border border-surface-variant flex gap-3 items-start group">
                            <div class="mt-1 text-secondary">
                                <span class="material-symbols-outlined text-[20px]" data-icon="link">link</span>
                            </div>
                            <div class="flex-1 flex flex-col gap-1">
                                <input
                                    class="bg-transparent border-none p-0 h-6 font-body-md text-caption text-on-surface focus:ring-0 outline-none w-full"
                                    placeholder="Link Title" type="text" value="Sony WH-1000XM5 Headphones" />
                                <input
                                    class="bg-transparent border-none p-0 h-5 font-body-md text-caption text-secondary focus:ring-0 outline-none w-full text-[12px]"
                                    placeholder="URL" type="text" value="https://affiliate.link/sony-xm5" />
                            </div>
                            <button
                                class="text-outline hover:text-error opacity-0 group-hover:opacity-100 transition-opacity">
                                <span class="material-symbols-outlined text-[18px]" data-icon="delete">delete</span>
                            </button>
                        </div>
                        <!-- Link List Item -->
                        <div
                            class="bg-surface-container-lowest p-3 rounded-lg border border-surface-variant flex gap-3 items-start group">
                            <div class="mt-1 text-secondary">
                                <span class="material-symbols-outlined text-[20px]" data-icon="link">link</span>
                            </div>
                            <div class="flex-1 flex flex-col gap-1">
                                <input
                                    class="bg-transparent border-none p-0 h-6 font-body-md text-caption text-on-surface focus:ring-0 outline-none w-full"
                                    placeholder="Link Title" type="text" value="Acoustic Foam Panels (12 Pack)" />
                                <input
                                    class="bg-transparent border-none p-0 h-5 font-body-md text-caption text-secondary focus:ring-0 outline-none w-full text-[12px]"
                                    placeholder="URL" type="text" value="https://affiliate.link/foam-panels" />
                            </div>
                            <button

                                <span class="material-symbols-outlined text-[18px]" data-icon="delete">delete</span>
                            </button>

                    </section>
                </div>
                <!-- Footer Publish Actions -->
                <div class="mt-auto p-6 bg-surface-container-low border-t border-surface-variant flex flex-col gap-3">
                    <button
                        class="w-full bg-primary text-on-primary font-label-md text-label-md py-3 rounded-lg hover:bg-primary-container transition-colors flex justify-center items-center gap-2">
                        <span class="material-symbols-outlined text-[18px]" data-icon="publish">publish</span>

                    <button

            </aside>
        </div>

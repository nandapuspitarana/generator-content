
<div style="width:100%;aspect-ratio:16/9;background:#e8e4dc;border-radius:14px;position:relative;overflow:hidden;display:flex;align-items:stretch;">

  <!-- Dark right panel bg -->
  <div style="position:absolute;right:0;top:0;width:42%;height:100%;background:#1c1c1c;"></div>

  <!-- LEFT: Content -->
  <div style="flex:1;display:flex;flex-direction:column;justify-content:space-between;padding:7% 5% 7% 7%;position:relative;z-index:1;">

    <div style="display:flex;align-items:center;gap:10px;">
      <div style="width:28px;height:2px;background:#1c1c1c;opacity:0.4;"></div>
      <div style="font-size:clamp(9px,1.3vw,11px);font-weight:700;letter-spacing:0.2em;color:#1c1c1c;opacity:0.5;font-family:Arial,sans-serif;text-transform:uppercase;">Book Review</div>
    </div>

    <div>
      <div style="font-size:clamp(9px,1.2vw,10px);font-weight:700;letter-spacing:0.25em;color:#c8102e;font-family:Arial,sans-serif;text-transform:uppercase;margin-bottom:10px;">No. 08</div>
      <div style="font-size:clamp(28px,6vw,56px);font-weight:900;line-height:0.92;color:#1c1c1c;font-family:Arial,sans-serif;letter-spacing:-2px;">Start<br>With<br>Why</div>
      <div style="width:36px;height:2px;background:#c8102e;margin-top:14px;margin-bottom:14px;"></div>
      <div style="font-size:clamp(9px,1.2vw,11px);color:#1c1c1c;opacity:0.5;font-family:Arial,sans-serif;font-style:italic;">Simon Sinek</div>
    </div>

    <div style="display:flex;flex-direction:column;gap:5px;">
      <div style="font-size:clamp(9px,1.1vw,10px);font-weight:700;letter-spacing:0.15em;color:#1c1c1c;opacity:0.35;font-family:Arial,sans-serif;text-transform:uppercase;">Tags</div>
      <div style="display:flex;gap:6px;flex-wrap:wrap;">
        <span style="font-size:clamp(8px,1.1vw,10px);font-weight:600;letter-spacing:0.1em;color:#1c1c1c;border:1px solid rgba(28,28,28,0.25);padding:3px 10px;border-radius:20px;font-family:Arial,sans-serif;text-transform:uppercase;">Tips</span>
        <span style="font-size:clamp(8px,1.1vw,10px);font-weight:600;letter-spacing:0.1em;color:#1c1c1c;border:1px solid rgba(28,28,28,0.25);padding:3px 10px;border-radius:20px;font-family:Arial,sans-serif;text-transform:uppercase;">Leadership</span>
        <span style="font-size:clamp(8px,1.1vw,10px);font-weight:600;letter-spacing:0.1em;color:#1c1c1c;border:1px solid rgba(28,28,28,0.25);padding:3px 10px;border-radius:20px;font-family:Arial,sans-serif;text-transform:uppercase;">Life</span>
      </div>
    </div>

  </div>

  <!-- RIGHT: Full image cover -->
  <div style="flex:0 0 42%;position:relative;z-index:1;display:flex;align-items:center;justify-content:center;">
    <!-- Book cover image — ganti src dengan path PNG kamu -->
    <img
      src="BOOK_COVER.png"
      alt="Book Cover"
      style="width:52%;aspect-ratio:2/3;object-fit:cover;border-radius:4px;box-shadow:0 12px 40px rgba(0,0,0,0.45);display:block;"
      onerror="this.style.display='none';this.nextElementSibling.style.display='flex';"
    />
    <!-- Fallback jika image belum ada -->
    <div style="display:none;width:52%;aspect-ratio:2/3;background:#2a2a2a;border-radius:4px;box-shadow:0 12px 40px rgba(0,0,0,0.45);align-items:center;justify-content:center;flex-direction:column;gap:6px;">
      <div style="font-size:11px;color:#666;font-family:Arial,sans-serif;text-align:center;padding:10px;">Upload<br>book cover PNG<br>here</div>
    </div>
  </div>

</div>
